<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>StarshipIt</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StarshipIt">
  <link rel="apple-touch-icon" href="/logo-192x192.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --text: #c9d1d9;
      --muted: #8b949e;
      --green: #3fb950;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      font-variant-numeric: tabular-nums;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ── App column ──
       On mobile this fills the viewport; on desktop it stays a phone-width
       column centred in the page so the content doesn't stretch edge-to-edge.
       (The 3D track / map view in track.html is intentionally full-width.) */
    .app {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── Mission name ── */
    .mission-name {
      font-size: 26px;
      font-weight: 700;
      padding: 14px 16px 4px;
      color: var(--text);
      min-height: 52px;
      text-align: center;
    }

    /* ── Countdown ── */
    .countdown-section {
      margin: 12px 16px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
    }
    .countdown-display {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 3px;
    }
    .countdown-prefix {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      padding-bottom: 5px;
      min-width: 34px;
      flex-shrink: 0;
    }
    .digit-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .group-label {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .digits { display: flex; gap: 3px; }
    .digit {
      width: 34px;
      height: 46px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 700;
      color: var(--accent);
      font-family: 'Courier New', Courier, monospace;
    }
    .colon {
      font-size: 34px;
      font-weight: 700;
      color: var(--muted);
      padding-bottom: 4px;
      flex-shrink: 0;
    }

    /* ── Track row ── */
    .track-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      font-size: 12px;
      color: var(--muted);
      padding: 4px 0 8px;
      letter-spacing: 0.03em;
    }
    .track-link {
      color: var(--accent);
      text-decoration: none;
      border: 1px solid rgba(88,166,255,0.35);
      border-radius: 4px;
      padding: 2px 8px;
      white-space: nowrap;
    }
    .track-link:hover { border-color: var(--accent); }

    /* ── Timeline ── */
    .timeline-list {
      list-style: none;
      padding: 0 16px 24px;
      position: relative;
    }
    .timeline-list::before {
      content: '';
      position: absolute;
      left: 24px;
      top: 0;
      bottom: 88px;
      width: 1px;
      background: var(--border);
    }
    .timeline-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 0;
      border-bottom: 1px solid var(--border);
    }
    .timeline-item:last-child { border-bottom: none; }
    .evt-circle {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 2px solid var(--muted);
      background: var(--bg);
      position: relative;
      z-index: 1;
      transition: background 0.3s, border-color 0.3s;
    }
    .evt-circle.done {
      background: var(--green);
      border-color: var(--green);
    }
    .evt-label {
      flex: 1;
      font-size: 15px;
      color: var(--text);
      transition: color 0.3s;
    }
    .evt-label.done { color: var(--muted); }
    .evt-time {
      font-size: 13px;
      color: var(--muted);
      font-family: 'Courier New', Courier, monospace;
      white-space: nowrap;
    }
    .timeline-item.upcoming .evt-circle { border-color: var(--accent); }
    .timeline-item.upcoming .evt-label  { color: var(--accent); }
    .timeline-item.upcoming .evt-time   { color: var(--accent); }

    /* ── Checklist ── */
    .checklist-header {
      padding: 6px 16px 14px;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .checklist-list {
      list-style: none;
      padding: 0 16px 24px;
    }
    .checklist-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
    }
    .checklist-item:last-child { border-bottom: none; }
    .chk-circle {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 2px solid var(--muted);
    }

    /* ── Status / error ── */
    #status-msg {
      padding: 40px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
    }

    /* ── Views ── */
    #timeline-view, #checklist-view { display: none; }
    #timeline-view.active, #checklist-view.active { display: block; }

    /* ── Footer ── */
    .footer {
      padding: 24px 16px 32px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
    .footer a {
      color: var(--muted);
      text-decoration: none;
    }
    .footer a:hover { color: var(--text); }
  </style>
</head>
<body>

<div class="app">

<h1 class="mission-name" id="mission-name">Loading…</h1>

<div class="countdown-section">
  <div class="countdown-display">
    <div class="countdown-prefix" id="cd-sign">T-</div>

    <div class="digit-group" id="days-group" style="display:none">
      <div class="group-label">DAYS</div>
      <div class="digits">
        <div class="digit" id="d-d1">0</div>
        <div class="digit" id="d-d2">0</div>
      </div>
    </div>
    <div class="colon" id="days-colon" style="display:none">:</div>

    <div class="digit-group">
      <div class="group-label">HOUR</div>
      <div class="digits">
        <div class="digit" id="d-h1">—</div>
        <div class="digit" id="d-h2">—</div>
      </div>
    </div>
    <div class="colon">:</div>
    <div class="digit-group">
      <div class="group-label">MIN</div>
      <div class="digits">
        <div class="digit" id="d-m1">—</div>
        <div class="digit" id="d-m2">—</div>
      </div>
    </div>
    <div class="colon">:</div>
    <div class="digit-group">
      <div class="group-label">SEC</div>
      <div class="digits">
        <div class="digit" id="d-s1">—</div>
        <div class="digit" id="d-s2">—</div>
      </div>
    </div>
  </div>
</div>

<div class="track-row">
  <span id="t0-local">Launch Attempt at — local</span>
  <a href="/track.html" class="track-link">3D Track ↗</a>
</div>

<div id="timeline-view">
  <ul class="timeline-list" id="timeline-list"></ul>
</div>

<div id="checklist-view">
  <div class="checklist-header">Pre-Launch Preparation</div>
  <ul class="checklist-list" id="checklist-list"></ul>
</div>

<div id="status-msg">Fetching launch data…</div>

<footer class="footer">
  <a href="https://github.com/jeffmhopkins/starshipit">GitHub</a>
  · Data: <a href="https://thespacedevs.com">Launch Library 2</a>
</footer>

</div><!-- .app -->

<script>
const TWO_DAYS_MS = 2 * 24 * 60 * 60 * 1000;

// SpaceX Starship Flight 13 (V3, 2nd flight) official flight plan.
// Countdown milestones plus the full ascent → deploy → relight → splashdown
// sequence. Times from the published SpaceX flight plan (corroborated by
// Wikipedia / SpaceLaunchSchedule / NASASpaceflight).
const TIMELINE_EVENTS = [
  { label: 'Go for Prop Load',    offsetSec: -(50*60)      },  // T-50:00
  { label: 'Ship LOX Load',       offsetSec: -(37*60 + 30) },  // T-37:30
  { label: 'Booster LOX Load',    offsetSec: -(37*60)      },  // T-37:00
  { label: 'Booster CH4 Load',    offsetSec: -(35*60 + 25) },  // T-35:25
  { label: 'Ship CH4 Load',       offsetSec: -(34*60 + 48) },  // T-34:48
  { label: 'Engine Chill',        offsetSec: -(21*60 + 30) },  // T-21:30
  { label: 'Booster Loaded',      offsetSec: -(2*60 + 50)  },  // T-2:50
  { label: 'Ship Prop Loaded',    offsetSec: -(2*60 + 10)  },  // T-2:10
  { label: 'Go for Launch',       offsetSec: -30           },  // T-30
  { label: 'Flame Diverter',      offsetSec: -17           },  // T-17
  { label: 'Engine Ignition',     offsetSec: -3            },  // T-3
  { label: 'Liftoff',             offsetSec: 0             },  // T+0
  { label: 'Max-Q',               offsetSec: 58            },  // T+0:58
  { label: 'MECO',                offsetSec: 2*60 + 18     },  // T+2:18
  { label: 'Hot-Staging',         offsetSec: 2*60 + 21     },  // T+2:21
  { label: 'Boostback Start',     offsetSec: 2*60 + 25     },  // T+2:25
  { label: 'Boostback End',       offsetSec: 3*60 + 3      },  // T+3:03
  { label: 'Booster Landing Burn', offsetSec: 6*60 + 27    },  // T+6:27
  { label: 'Booster Splashdown',  offsetSec: 6*60 + 53     },  // T+6:53
  { label: 'Ship Engine Cutoff',  offsetSec: 8*60 + 5      },  // T+8:05 (SECO)
  { label: 'Starlink Deploy',     offsetSec: 16*60 + 40    },  // T+16:40
  { label: 'Deploy Complete',     offsetSec: 27*60 + 39    },  // T+27:39
  { label: 'Raptor Relight',      offsetSec: 38*60 + 58    },  // T+38:58
  { label: 'Atmospheric Entry',   offsetSec: 47*60 + 30    },  // T+47:30
  { label: 'Ship Landing Burn',   offsetSec: 65*60 + 1     },  // T+1:05:01
  { label: 'Ship Splashdown',     offsetSec: 65*60 + 21    },  // T+1:05:21
];

const CHECKLIST = [
  'Range clear & FAA license active',
  'Propellant systems nominal',
  'Flight termination system armed',
  'Weather within constraints',
  'Ship and booster fully stacked',
  'Ground support equipment ready',
  'Communication systems verified',
  'Launch director GO/NO-GO poll',
];

let t0 = null;

function p2(n) { return String(n).padStart(2, '0'); }

function formatOffset(sec) {
  const sign = sec >= 0 ? '+' : '-';
  const a = Math.abs(sec);
  return `T${sign}${p2(Math.floor(a / 3600))}:${p2(Math.floor((a % 3600) / 60))}:${p2(a % 60)}`;
}

function setDigits(ms) {
  const totalSec = Math.floor(Math.abs(ms) / 1000);
  const d = Math.floor(totalSec / 86400);
  const h = Math.floor((totalSec % 86400) / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;

  const dg = document.getElementById('days-group');
  const dc = document.getElementById('days-colon');
  if (d > 0) {
    dg.style.display = '';
    dc.style.display = '';
    const ds = p2(Math.min(d, 99));
    document.getElementById('d-d1').textContent = ds[0];
    document.getElementById('d-d2').textContent = ds[1];
  } else {
    dg.style.display = 'none';
    dc.style.display = 'none';
  }

  const hs = p2(h), ms2 = p2(m), ss = p2(s);
  document.getElementById('d-h1').textContent = hs[0];
  document.getElementById('d-h2').textContent = hs[1];
  document.getElementById('d-m1').textContent = ms2[0];
  document.getElementById('d-m2').textContent = ms2[1];
  document.getElementById('d-s1').textContent = ss[0];
  document.getElementById('d-s2').textContent = ss[1];
}

function updateDisplay() {
  if (!t0) return;
  const now = Date.now();
  const delta = t0 - now;
  document.getElementById('cd-sign').textContent = delta >= 0 ? 'T-' : 'T+';
  setDigits(delta);

  const items = document.querySelectorAll('.timeline-item');
  let markedNext = false;
  items.forEach((item, i) => {
    const ev = TIMELINE_EVENTS[i];
    const eventTime = t0 + ev.offsetSec * 1000;
    const done = now >= eventTime;
    const circle = item.querySelector('.evt-circle');
    const label  = item.querySelector('.evt-label');

    if (done) {
      circle.classList.add('done');
      label.classList.add('done');
      item.classList.remove('upcoming');
    } else {
      circle.classList.remove('done');
      label.classList.remove('done');
      if (!markedNext) {
        item.classList.add('upcoming');
        markedNext = true;
      } else {
        item.classList.remove('upcoming');
      }
    }
  });
}

function renderTimeline() {
  const list = document.getElementById('timeline-list');
  list.innerHTML = '';
  TIMELINE_EVENTS.forEach(ev => {
    const li = document.createElement('li');
    li.className = 'timeline-item';
    li.innerHTML =
      `<div class="evt-circle"></div>` +
      `<span class="evt-label">${ev.label}</span>` +
      `<span class="evt-time">${formatOffset(ev.offsetSec)}</span>`;
    list.appendChild(li);
  });
}

function renderChecklist() {
  const list = document.getElementById('checklist-list');
  list.innerHTML = '';
  CHECKLIST.forEach(text => {
    const li = document.createElement('li');
    li.className = 'checklist-item';
    li.innerHTML = `<div class="chk-circle"></div><span>${text}</span>`;
    list.appendChild(li);
  });
}

function showTimeline() {
  document.getElementById('timeline-view').classList.add('active');
  document.getElementById('checklist-view').classList.remove('active');
  renderTimeline();
  updateDisplay();
  setTimeout(() => {
    const next = document.querySelector('.timeline-item.upcoming');
    if (next) next.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 350);
}

function showChecklist() {
  document.getElementById('checklist-view').classList.add('active');
  document.getElementById('timeline-view').classList.remove('active');
  renderChecklist();
  updateDisplay();
}

const LAUNCH_CACHE_KEY = 'starshipit_launch_v1';
const LAUNCH_CACHE_TTL = 15 * 60 * 1000; // 15 minutes

async function fetchLaunch() {
  // Return cached data if fresh enough
  try {
    const raw = localStorage.getItem(LAUNCH_CACHE_KEY);
    if (raw) {
      const { ts, data } = JSON.parse(raw);
      if (Date.now() - ts < LAUNCH_CACHE_TTL) return data;
    }
  } catch {}

  try {
    const res = await fetch(
      'https://ll.thespacedevs.com/2.2.0/launch/upcoming/?search=Starship&limit=1'
    );
    if (!res.ok) throw new Error(`API ${res.status}`);
    const data = await res.json();
    if (!data.results?.length) throw new Error('No upcoming launches');
    try { localStorage.setItem(LAUNCH_CACHE_KEY, JSON.stringify({ ts: Date.now(), data })); } catch {}
    return data;
  } catch (err) {
    // On rate-limit or network failure, serve stale cache rather than error
    try {
      const raw = localStorage.getItem(LAUNCH_CACHE_KEY);
      if (raw) return JSON.parse(raw).data;
    } catch {}
    throw err;
  }
}

async function init() {
  const statusEl = document.getElementById('status-msg');
  try {
    const data = await fetchLaunch();
    if (!data.results?.length) throw new Error('No upcoming Starship launches found');

    const launch = data.results[0];
    t0 = new Date(launch.net).getTime();
    document.getElementById('mission-name').textContent = launch.name;
    document.getElementById('t0-local').textContent =
      'Launch Attempt at ' + new Date(t0).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + ' local';
    statusEl.style.display = 'none';

    if (t0 - Date.now() <= TWO_DAYS_MS) {
      showTimeline();
    } else {
      showChecklist();
    }
    setInterval(updateDisplay, 1000);
  } catch (err) {
    statusEl.textContent = `⚠️ ${err.message}`;
  }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js').catch(() => {});
}

init();
</script>
</body>
</html>
