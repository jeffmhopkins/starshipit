<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarshipIt — Track</title>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --accent: #58a6ff;
      --green: #3fb950;
      --text: #c9d1d9;
      --muted: #8b949e;
      --dim: #6e7681;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--text);
    }

    #cesiumContainer { width: 100%; height: 100%; }

    /* Strip all Cesium UI chrome */
    .cesium-viewer-bottom,
    .cesium-viewer-toolbar,
    .cesium-viewer-animationContainer,
    .cesium-viewer-timelineContainer,
    .cesium-viewer-fullscreenContainer,
    .cesium-viewer-perf_watcherContainer,
    .cesium-credit-logoContainer,
    .cesium-credit-textContainer { display: none !important; }

    /* ── Top-left overlay ── */
    #overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      pointer-events: none;
    }

    #mission-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    .t-clock {
      display: flex;
      align-items: baseline;
      gap: 4px;
      font-variant-numeric: tabular-nums;
    }
    .t-sign {
      font-size: 15px;
      font-weight: 700;
      min-width: 26px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }
    .t-digits {
      font-size: 30px;
      font-weight: 700;
      font-family: 'Courier New', Courier, monospace;
      color: var(--accent);
      text-shadow: 0 1px 8px rgba(88,166,255,0.4);
    }

    /* ── Back link ── */
    #back-link {
      position: absolute;
      top: 16px;
      right: 16px;
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
      background: rgba(13,17,23,0.7);
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(48,54,61,0.8);
      transition: color 0.2s;
    }
    #back-link:hover { color: var(--text); }

    /* ── Bottom legend ── */
    #legend {
      position: absolute;
      bottom: 20px;
      left: 16px;
      background: rgba(13,17,23,0.75);
      border: 1px solid rgba(48,54,61,0.8);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
    }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }
    .legend-row:last-of-type { margin-bottom: 8px; }
    .dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    #disclaimer {
      font-size: 10px;
      color: var(--dim);
      border-top: 1px solid rgba(48,54,61,0.6);
      padding-top: 6px;
      margin-top: 2px;
    }

    /* ── View controls ── */
    #view-controls {
      position: absolute;
      bottom: 20px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .view-btn {
      background: rgba(13,17,23,0.80);
      border: 1px solid rgba(48,54,61,0.9);
      color: var(--muted);
      font-size: 12px;
      font-family: inherit;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .view-btn:hover { color: var(--text); }
    .view-btn.active {
      color: var(--accent);
      border-color: rgba(88,166,255,0.55);
    }
  </style>
</head>
<body>

<div id="cesiumContainer"></div>

<div id="overlay">
  <div id="mission-name">Loading…</div>
  <div class="t-clock">
    <span class="t-sign" id="t-sign">T-</span>
    <span class="t-digits" id="t-digits">--:--:--</span>
  </div>
</div>

<a href="/" id="back-link">← Back</a>

<div id="legend">
  <div class="legend-row">
    <div class="dot" style="background:var(--accent)"></div>
    <span>Booster</span>
  </div>
  <div class="legend-row">
    <div class="dot" style="background:var(--green)"></div>
    <span>Ship</span>
  </div>
  <div id="disclaimer">Nominal flight profile · not live telemetry</div>
</div>

<div id="view-controls">
  <button class="view-btn" id="btn-horizon" onclick="setCameraMode('horizon')">↗ Horizon</button>
  <button class="view-btn" id="btn-orbit"   onclick="setCameraMode('orbit')">↔ Orbit</button>
  <button class="view-btn active" id="btn-globe" onclick="setCameraMode('globe')">⊕ Globe</button>
</div>

<script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script>
<script>
const viewer = new Cesium.Viewer('cesiumContainer', {
  imageryProvider: false,
  baseLayer: Cesium.ImageryLayer.fromProviderAsync(
    Cesium.TileMapServiceImageryProvider.fromUrl(
      Cesium.buildModuleUrl('Assets/Textures/NaturalEarthII')
    )
  ),
  animation: false,
  baseLayerPicker: false,
  fullscreenButton: false,
  geocoder: false,
  homeButton: false,
  infoBox: false,
  sceneModePicker: false,
  selectionIndicator: false,
  timeline: false,
  navigationHelpButton: false,
  skyBox: false,
});

viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#0d1117');
viewer.scene.globe.enableLighting = true;

// ── Nominal trajectory waypoints [T+sec, lon°, lat°, alt_m] ────────────
// Approximate IFT profile based on SpaceX webcast telemetry

const BOOSTER = [
  [   0, -97.157, 25.997,    20],  // Liftoff
  [  15, -97.120, 25.993,  1500],
  [  30, -97.050, 25.988,  5500],
  [  45, -96.960, 25.975,  9800],  // Max-Q
  [  60, -96.845, 25.958, 13500],
  [  80, -96.690, 25.928, 22000],
  [ 100, -96.490, 25.880, 34000],
  [ 120, -96.270, 25.810, 47000],
  [ 140, -96.040, 25.715, 59000],
  [ 160, -95.810, 25.600, 68000],
  [ 164, -95.760, 25.568, 69000],  // MECO
  [ 170, -95.710, 25.520, 70500],  // Stage Sep / Boostback Ignition
  [ 185, -95.648, 25.477, 74000],  // Boostback burn
  [ 200, -95.595, 25.440, 78500],
  [ 220, -95.560, 25.408, 84000],
  [ 240, -95.548, 25.385, 88500],
  [ 255, -95.548, 25.372, 90500],  // Apex
  [ 270, -95.572, 25.378, 88500],  // Descending
  [ 290, -95.710, 25.450, 79000],
  [ 310, -95.960, 25.560, 63000],
  [ 330, -96.220, 25.678, 45000],  // Entry burn start
  [ 350, -96.490, 25.800, 27000],
  [ 370, -96.750, 25.900, 13000],
  [ 390, -96.980, 25.958,  5500],
  [ 408, -97.110, 25.987,  1400],
  [ 420, -97.157, 25.997,     0],  // Mechazilla catch
];

const SHIP = [
  [    0, -97.157, 25.997,    20],  // Liftoff
  [   15, -97.120, 25.993,  1500],
  [   30, -97.050, 25.988,  5500],
  [   45, -96.960, 25.975,  9800],  // Max-Q
  [   60, -96.845, 25.958, 13500],
  [   80, -96.690, 25.928, 22000],
  [  100, -96.490, 25.880, 34000],
  [  120, -96.270, 25.810, 47000],
  [  140, -96.040, 25.715, 59000],
  [  160, -95.810, 25.600, 68000],
  [  164, -95.760, 25.568, 69000],  // MECO / Hot-Stage
  [  170, -95.710, 25.520, 70500],  // Stage Sep
  [  200, -95.010, 25.220, 88000],
  [  240, -93.820, 24.720,112000],
  [  290, -92.120, 23.920,133000],
  [  350, -89.830, 22.820,145000],
  [  430, -86.900, 21.300,152000],
  [  510, -83.400, 19.200,155000],  // SECO
  [  650, -76.200, 15.100,161000],
  [  800, -67.500,  9.600,164500],
  [  950, -57.500,  3.200,166000],  // Apogee
  [ 1100, -46.800, -3.400,164500],
  [ 1300, -33.200,-10.400,162000],
  [ 1500, -17.800,-15.900,160000],
  [ 1700,  -1.200,-20.000,157000],
  [ 1900,  14.800,-22.500,155000],
  [ 2100,  30.000,-24.000,152000],
  [ 2300,  44.200,-25.000,149000],
  [ 2500,  57.000,-25.800,145000],
  [ 2700,  68.000,-26.400,140000],
  [ 2900,  76.200,-27.000,126000],
  [ 3050,  80.800,-27.400,107000],
  [ 3150,  83.500,-27.700, 87000],  // Reentry heating
  [ 3280,  86.500,-27.900, 55000],  // Reentry burn
  [ 3420,  88.300,-28.000, 24000],
  [ 3580,  89.300,-28.000,  9000],
  [ 3750,  89.800,-28.000,  2500],
  [ 3900,  90.000,-28.000,     0],  // Splashdown
];

function toCzmlPositions(wpts) {
  return wpts.flatMap(([t, lon, lat, alt]) => [t, lon, lat, alt]);
}

function interpolatePos(wpts, tSec) {
  if (tSec <= wpts[0][0]) return [wpts[0][1], wpts[0][2], wpts[0][3]];
  for (let i = 1; i < wpts.length; i++) {
    const [t0, lon0, lat0, alt0] = wpts[i - 1];
    const [t1, lon1, lat1, alt1] = wpts[i];
    if (tSec <= t1) {
      const f = (tSec - t0) / (t1 - t0);
      return [lon0 + f*(lon1-lon0), lat0 + f*(lat1-lat0), alt0 + f*(alt1-alt0)];
    }
  }
  const w = wpts[wpts.length - 1];
  return [w[1], w[2], w[3]];
}

// [label, T+sec, waypoint array, pixel label offset [x,y]]
const FLIGHT_EVENTS = [
  ['Max-Q',          45,   SHIP,    [  0, -20]],
  ['MECO',          164,   BOOSTER, [-68, -14]],
  ['Stage Sep',     170,   SHIP,    [ 68, -14]],
  ['Boostback Burn',189,   BOOSTER, [  0,  18]],
  ['Entry Burn',    330,   BOOSTER, [  0, -20]],
  ['Ship SECO',     510,   SHIP,    [  0, -20]],
  ['Reentry Burn', 3280,   SHIP,    [  0,  18]],
  ['Splashdown',   3900,   SHIP,    [  0, -20]],
];

function addEventMarkers() {
  FLIGHT_EVENTS.forEach(([label, tSec, wpts, [ox, oy]]) => {
    const [lon, lat, alt] = interpolatePos(wpts, tSec);
    viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(lon, lat, alt),
      point: {
        color: Cesium.Color.WHITE.withAlpha(0.9),
        pixelSize: 6,
        outlineColor: Cesium.Color.fromCssColorString('#0d1117'),
        outlineWidth: 1.5,
      },
      label: {
        text: label,
        font: '11px system-ui, -apple-system, sans-serif',
        fillColor: Cesium.Color.fromCssColorString('#c9d1d9'),
        outlineColor: Cesium.Color.fromCssColorString('#0d1117'),
        outlineWidth: 2,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
        pixelOffset: new Cesium.Cartesian2(ox, oy),
        distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 8_000_000),
      }
    });
  });
}

function buildCzml(t0Iso, name) {
  const t0 = new Date(t0Iso);
  const endBooster = new Date(t0.getTime() + BOOSTER.at(-1)[0] * 1000).toISOString();
  const endShip    = new Date(t0.getTime() + SHIP.at(-1)[0]    * 1000).toISOString();

  return [
    {
      id: 'document', name, version: '1.0',
      clock: {
        interval: `${t0Iso}/${endShip}`,
        currentTime: new Date().toISOString(),
        multiplier: 1,
        range: 'UNBOUNDED',
        step: 'SYSTEM_CLOCK'
      }
    },
    {
      id: 'launchpad', name: 'Starbase',
      position: { cartographicDegrees: [-97.157, 25.997, 20] },
      point: { color: { rgba: [255,255,255,255] }, pixelSize: 8 },
      label: {
        text: 'Starbase',
        font: '11px system-ui',
        fillColor: { rgba: [201,209,217,255] },
        outlineColor: { rgba: [0,0,0,255] },
        outlineWidth: 2,
        style: 'FILL_AND_OUTLINE',
        pixelOffset: { cartesian2: [0, -18] }
      }
    },
    {
      id: 'booster', name: 'Booster',
      availability: `${t0Iso}/${endBooster}`,
      path: {
        show: true,
        material: { solidColor: { color: { rgba: [88,166,255,255] } } },
        width: 4,
        leadTime: 0,
        trailTime: 7200
      },
      point: {
        color: { rgba: [88,166,255,255] },
        pixelSize: 11,
        outlineColor: { rgba: [255,255,255,160] },
        outlineWidth: 1
      },
      position: {
        epoch: t0Iso,
        cartographicDegrees: toCzmlPositions(BOOSTER),
        interpolationAlgorithm: 'LAGRANGE',
        interpolationDegree: 3
      }
    },
    {
      id: 'ship', name: 'Ship',
      availability: `${t0Iso}/${endShip}`,
      path: {
        show: true,
        material: { solidColor: { color: { rgba: [63,185,80,255] } } },
        width: 4,
        leadTime: 0,
        trailTime: 7200
      },
      point: {
        color: { rgba: [63,185,80,255] },
        pixelSize: 11,
        outlineColor: { rgba: [255,255,255,160] },
        outlineWidth: 1
      },
      position: {
        epoch: t0Iso,
        cartographicDegrees: toCzmlPositions(SHIP),
        interpolationAlgorithm: 'LAGRANGE',
        interpolationDegree: 3
      }
    }
  ];
}

// ── Ghost planned-trajectory polylines ──────────────────────────────────
function addPlannedPaths() {
  const toCartesian = wpts =>
    wpts.map(([, lon, lat, alt]) => Cesium.Cartesian3.fromDegrees(lon, lat, alt));

  viewer.entities.add({
    polyline: {
      positions: toCartesian(BOOSTER),
      width: 1.5,
      material: Cesium.Color.fromBytes(88, 166, 255, 80),
      clampToGround: false,
    }
  });

  viewer.entities.add({
    polyline: {
      positions: toCartesian(SHIP),
      width: 1.5,
      material: Cesium.Color.fromBytes(63, 185, 80, 80),
      clampToGround: false,
    }
  });
}

// ── Camera follow modes ──────────────────────────────────────────────────
const isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
let cameraMode = 'globe';
let trackHandler = null;

function getActiveVehicle() {
  const tSec = t0Ms ? (Date.now() - t0Ms) / 1000 : -9999;
  return tSec < 420
    ? { entityId: 'booster', wpts: BOOSTER }
    : { entityId: 'ship',    wpts: SHIP };
}

function getHeadingAtTime(wpts, tSec) {
  const first = wpts[0][0], last = wpts[wpts.length - 1][0];
  const t = Math.max(first + 2, Math.min(last - 2, tSec));
  const [lon1, lat1] = interpolatePos(wpts, t - 2);
  const [lon2, lat2] = interpolatePos(wpts, t + 2);
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
  return Math.atan2(
    Math.sin(dLon) * Math.cos(φ2),
    Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(dLon)
  );
}

function followCamera() {
  const { entityId, wpts } = getActiveVehicle();
  const ds = viewer.dataSources.get(0);
  if (!ds) return;
  const entity = ds.entities.getById(entityId);
  if (!entity) return;
  const pos = entity.position?.getValue(viewer.clock.currentTime)
           ?? Cesium.Cartesian3.fromDegrees(-97.157, 25.997, 20);

  const tSec = t0Ms ? (Date.now() - t0Ms) / 1000 : 0;
  const heading = getHeadingAtTime(wpts, tSec);

  if (cameraMode === 'horizon') {
    // 200 km behind vehicle, 12° above horizon
    viewer.camera.lookAt(pos,
      new Cesium.HeadingPitchRange(heading + Math.PI, Cesium.Math.toRadians(-12), 200_000));
  } else if (cameraMode === 'orbit') {
    // 350 km to the side, tangent to travel direction
    viewer.camera.lookAt(pos,
      new Cesium.HeadingPitchRange(heading + Math.PI / 2, Cesium.Math.toRadians(-18), 350_000));
  }
}

function updateViewButtons(mode) {
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  const el = document.getElementById('btn-' + mode);
  if (el) el.classList.add('active');
}

function setCameraMode(mode) {
  cameraMode = mode;
  updateViewButtons(mode);
  viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY); // release lookAt lock
  if (trackHandler) {
    viewer.scene.postRender.removeEventListener(trackHandler);
    trackHandler = null;
  }
  if (mode === 'globe') {
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(-20, 5, 18_000_000),
      duration: 1.5,
    });
  } else {
    trackHandler = followCamera;
    viewer.scene.postRender.addEventListener(trackHandler);
  }
}

// ── T± overlay clock ────────────────────────────────────────────────────
let t0Ms = null;

function p2(n) { return String(n).padStart(2, '0'); }

function tickOverlay() {
  if (!t0Ms) return;
  const delta = t0Ms - Date.now();
  const abs = Math.floor(Math.abs(delta) / 1000);
  document.getElementById('t-sign').textContent  = delta >= 0 ? 'T-' : 'T+';
  document.getElementById('t-digits').textContent =
    `${p2(Math.floor(abs / 3600))}:${p2(Math.floor((abs % 3600) / 60))}:${p2(abs % 60)}`;
}
setInterval(tickOverlay, 1000);

// ── Init ────────────────────────────────────────────────────────────────
async function init() {
  try {
    const res  = await fetch('https://ll.thespacedevs.com/2.2.0/launch/upcoming/?search=Starship&limit=1');
    const data = await res.json();
    const launch = data.results[0];

    t0Ms = new Date(launch.net).getTime();
    document.getElementById('mission-name').textContent = launch.name;
    document.title = `StarshipIt — ${launch.name}`;

    addPlannedPaths();
    addEventMarkers();

    const czml = buildCzml(launch.net, launch.name);
    const ds   = await Cesium.CzmlDataSource.load(czml);
    viewer.dataSources.add(ds);

    // Sync Cesium clock to wall time
    viewer.clock.currentTime  = Cesium.JulianDate.fromDate(new Date());
    viewer.clock.shouldAnimate = true;
    viewer.clock.multiplier   = 1;

    const tSec = (Date.now() - t0Ms) / 1000;
    const inFlight = tSec >= 0 && tSec <= SHIP.at(-1)[0];

    if (isMobile && inFlight) {
      // Mobile + active flight: snap to chase view centered on vehicle
      setCameraMode('horizon');
    } else {
      // Default: regional view of the launch site
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(-97.157, 25.997, 3_500_000),
        orientation: { heading: 0, pitch: -Cesium.Math.toRadians(55), roll: 0 },
        duration: 2,
      });
    }

    tickOverlay();
  } catch {
    document.getElementById('mission-name').textContent = 'Unable to load launch data';
  }
}

init();
</script>
</body>
</html>
