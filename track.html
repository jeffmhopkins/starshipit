<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarshipIt — Track</title>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --accent: #58a6ff;
      --green: #3fb950;
      --text: #c9d1d9;
      --muted: #8b949e;
      --dim: #6e7681;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--text);
    }

    #cesiumContainer { width: 100%; height: 100%; }

    /* Strip all Cesium UI chrome */
    .cesium-viewer-bottom,
    .cesium-viewer-toolbar,
    .cesium-viewer-animationContainer,
    .cesium-viewer-timelineContainer,
    .cesium-viewer-fullscreenContainer,
    .cesium-viewer-perf_watcherContainer,
    .cesium-credit-logoContainer,
    .cesium-credit-textContainer { display: none !important; }

    /* ── Top-left overlay ── */
    #overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      pointer-events: none;
    }

    #mission-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    .t-clock {
      display: flex;
      align-items: baseline;
      gap: 4px;
      font-variant-numeric: tabular-nums;
    }
    .t-sign {
      font-size: 15px;
      font-weight: 700;
      min-width: 26px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }
    .t-digits {
      font-size: 30px;
      font-weight: 700;
      font-family: 'Courier New', Courier, monospace;
      color: var(--accent);
      text-shadow: 0 1px 8px rgba(88,166,255,0.4);
    }

    /* ── Back link ── */
    #back-link {
      position: absolute;
      top: 16px;
      right: 16px;
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
      background: rgba(13,17,23,0.7);
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(48,54,61,0.8);
      transition: color 0.2s;
    }
    #back-link:hover { color: var(--text); }

    /* ── Bottom legend ── */
    #legend {
      position: absolute;
      bottom: 20px;
      left: 16px;
      background: rgba(13,17,23,0.75);
      border: 1px solid rgba(48,54,61,0.8);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
    }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }
    .legend-row:last-of-type { margin-bottom: 8px; }
    .dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    #disclaimer {
      font-size: 10px;
      color: var(--dim);
      border-top: 1px solid rgba(48,54,61,0.6);
      padding-top: 6px;
      margin-top: 2px;
    }
  </style>
</head>
<body>

<div id="cesiumContainer"></div>

<div id="overlay">
  <div id="mission-name">Loading…</div>
  <div class="t-clock">
    <span class="t-sign" id="t-sign">T-</span>
    <span class="t-digits" id="t-digits">--:--:--</span>
  </div>
</div>

<a href="/" id="back-link">← Back</a>

<div id="legend">
  <div class="legend-row">
    <div class="dot" style="background:var(--accent)"></div>
    <span>Booster</span>
  </div>
  <div class="legend-row">
    <div class="dot" style="background:var(--green)"></div>
    <span>Ship</span>
  </div>
  <div id="disclaimer">Nominal flight profile · not live telemetry</div>
</div>

<script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script>
<script>
// Free token: https://ion.cesium.com/tokens
// Without a token, Cesium falls back to built-in Natural Earth imagery.
Cesium.Ion.defaultAccessToken = 'YOUR_CESIUM_TOKEN';

const viewer = new Cesium.Viewer('cesiumContainer', {
  animation: false,
  baseLayerPicker: false,
  fullscreenButton: false,
  geocoder: false,
  homeButton: false,
  infoBox: false,
  sceneModePicker: false,
  selectionIndicator: false,
  timeline: false,
  navigationHelpButton: false,
  skyBox: false,
});

viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#0d1117');
viewer.scene.globe.enableLighting = true;

// ── Nominal trajectory waypoints [T+sec, lon°, lat°, alt_m] ────────────
// Approximate IFT profile based on SpaceX webcast telemetry

const BOOSTER = [
  [   0, -97.157,  25.997,     20],
  [  30, -97.050,  25.990,   5000],
  [  60, -96.850,  25.950,  12000],
  [  90, -96.500,  25.850,  30000],
  [ 130, -96.100,  25.700,  52000],
  [ 170, -95.700,  25.500,  70000],
  [ 210, -95.580,  25.400,  82000],
  [ 260, -95.550,  25.350,  90000],  // apex / flip
  [ 310, -95.900,  25.550,  70000],
  [ 360, -96.500,  25.800,  30000],
  [ 400, -97.000,  25.960,   5000],
  [ 420, -97.157,  25.997,      0],  // Mechazilla catch
];

const SHIP = [
  [    0, -97.157,  25.997,     20],
  [   60, -96.850,  25.950,  12000],
  [  130, -96.100,  25.700,  52000],
  [  170, -95.700,  25.500,  70000],  // stage sep
  [  220, -94.800,  25.300, 100000],
  [  300, -93.000,  24.800, 130000],
  [  400, -90.000,  24.000, 148000],
  [  510, -85.000,  22.500, 155000],  // SECO
  [  700, -75.000,  18.000, 158000],
  [  900, -60.000,  10.000, 160000],
  [ 1400,  10.000,   0.000, 159000],
  [ 1800,  30.000,  -8.000, 157000],
  [ 2200,  55.000, -14.000, 154000],
  [ 2700,  72.000, -20.000, 148000],
  [ 3000,  78.000, -22.000, 130000],
  [ 3300,  85.000, -25.000,  80000],  // reentry burn
  [ 3600,  89.000, -27.000,  30000],
  [ 3900,  90.000, -28.000,      0],  // splashdown
];

function toCzmlPositions(wpts) {
  return wpts.flatMap(([t, lon, lat, alt]) => [t, lon, lat, alt]);
}

function buildCzml(t0Iso, name) {
  const t0 = new Date(t0Iso);
  const endBooster = new Date(t0.getTime() + BOOSTER.at(-1)[0] * 1000).toISOString();
  const endShip    = new Date(t0.getTime() + SHIP.at(-1)[0]    * 1000).toISOString();

  return [
    {
      id: 'document', name, version: '1.0',
      clock: {
        interval: `${t0Iso}/${endShip}`,
        currentTime: new Date().toISOString(),
        multiplier: 1,
        range: 'UNBOUNDED',
        step: 'SYSTEM_CLOCK'
      }
    },
    {
      id: 'launchpad', name: 'Starbase',
      position: { cartographicDegrees: [-97.157, 25.997, 20] },
      point: { color: { rgba: [255,255,255,255] }, pixelSize: 8 },
      label: {
        text: 'Starbase',
        font: '11px system-ui',
        fillColor: { rgba: [201,209,217,255] },
        outlineColor: { rgba: [0,0,0,255] },
        outlineWidth: 2,
        style: 'FILL_AND_OUTLINE',
        pixelOffset: { cartesian2: [0, -18] }
      }
    },
    {
      id: 'booster', name: 'Booster',
      availability: `${t0Iso}/${endBooster}`,
      path: {
        show: true,
        material: { solidColor: { color: { rgba: [88,166,255,210] } } },
        width: 2,
        leadTime: 0,
        trailTime: 7200
      },
      point: {
        color: { rgba: [88,166,255,255] },
        pixelSize: 11,
        outlineColor: { rgba: [255,255,255,160] },
        outlineWidth: 1
      },
      position: {
        epoch: t0Iso,
        cartographicDegrees: toCzmlPositions(BOOSTER),
        interpolationAlgorithm: 'LAGRANGE',
        interpolationDegree: 5
      }
    },
    {
      id: 'ship', name: 'Ship',
      availability: `${t0Iso}/${endShip}`,
      path: {
        show: true,
        material: { solidColor: { color: { rgba: [63,185,80,210] } } },
        width: 2,
        leadTime: 0,
        trailTime: 7200
      },
      point: {
        color: { rgba: [63,185,80,255] },
        pixelSize: 11,
        outlineColor: { rgba: [255,255,255,160] },
        outlineWidth: 1
      },
      position: {
        epoch: t0Iso,
        cartographicDegrees: toCzmlPositions(SHIP),
        interpolationAlgorithm: 'LAGRANGE',
        interpolationDegree: 5
      }
    }
  ];
}

// ── T± overlay clock ────────────────────────────────────────────────────
let t0Ms = null;

function p2(n) { return String(n).padStart(2, '0'); }

function tickOverlay() {
  if (!t0Ms) return;
  const delta = t0Ms - Date.now();
  const abs = Math.floor(Math.abs(delta) / 1000);
  document.getElementById('t-sign').textContent  = delta >= 0 ? 'T-' : 'T+';
  document.getElementById('t-digits').textContent =
    `${p2(Math.floor(abs / 3600))}:${p2(Math.floor((abs % 3600) / 60))}:${p2(abs % 60)}`;
}
setInterval(tickOverlay, 1000);

// ── Init ────────────────────────────────────────────────────────────────
async function init() {
  try {
    const res  = await fetch('https://ll.thespacedevs.com/2.2.0/launch/upcoming/?search=Starship&limit=1');
    const data = await res.json();
    const launch = data.results[0];

    t0Ms = new Date(launch.net).getTime();
    document.getElementById('mission-name').textContent = launch.name;
    document.title = `StarshipIt — ${launch.name}`;

    const czml = buildCzml(launch.net, launch.name);
    const ds   = await Cesium.CzmlDataSource.load(czml);
    viewer.dataSources.add(ds);

    // Sync Cesium clock to wall time
    viewer.clock.currentTime  = Cesium.JulianDate.fromDate(new Date());
    viewer.clock.shouldAnimate = true;
    viewer.clock.multiplier   = 1;

    // Initial camera: looking down at launch site from 3500 km
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(-97.157, 25.997, 3500000),
      orientation: {
        heading: 0,
        pitch: -Cesium.Math.toRadians(55),
        roll: 0
      },
      duration: 2
    });

    tickOverlay();
  } catch {
    document.getElementById('mission-name').textContent = 'Unable to load launch data';
  }
}

init();
</script>
</body>
</html>
