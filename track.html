<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StarshipIt — Track</title>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --accent: #58a6ff;
      --green: #3fb950;
      --text: #c9d1d9;
      --muted: #8b949e;
      --dim: #6e7681;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--text);
    }

    #cesiumContainer { width: 100%; height: 100%; }

    /* Strip all Cesium UI chrome */
    .cesium-viewer-bottom,
    .cesium-viewer-toolbar,
    .cesium-viewer-animationContainer,
    .cesium-viewer-timelineContainer,
    .cesium-viewer-fullscreenContainer,
    .cesium-viewer-perf_watcherContainer,
    .cesium-credit-logoContainer,
    .cesium-credit-textContainer { display: none !important; }

    /* ── Top-left overlay ── */
    #overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      pointer-events: none;
    }

    #mission-name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 10px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    .t-clock {
      display: flex;
      align-items: baseline;
      gap: 4px;
      font-variant-numeric: tabular-nums;
    }
    .t-sign {
      font-size: 15px;
      font-weight: 700;
      min-width: 26px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }
    .t-digits {
      font-size: 30px;
      font-weight: 700;
      font-family: 'Courier New', Courier, monospace;
      color: var(--accent);
      text-shadow: 0 1px 8px rgba(88,166,255,0.4);
    }

    /* ── Back link ── */
    #back-link {
      position: absolute;
      top: 16px;
      right: 16px;
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
      background: rgba(13,17,23,0.7);
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid rgba(48,54,61,0.8);
      transition: color 0.2s;
    }
    #back-link:hover { color: var(--text); }

    /* ── Bottom legend ── */
    #legend {
      position: absolute;
      bottom: max(20px, calc(14px + env(safe-area-inset-bottom)));
      left: 16px;
      z-index: 1000;
      background: rgba(13,17,23,0.75);
      border: 1px solid rgba(48,54,61,0.8);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
    }
    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }
    .legend-row:last-of-type { margin-bottom: 8px; }
    .dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    #disclaimer {
      font-size: 10px;
      color: var(--dim);
      border-top: 1px solid rgba(48,54,61,0.6);
      padding-top: 6px;
      margin-top: 2px;
    }

    /* ── View controls ── */
    #view-controls {
      position: absolute;
      bottom: max(20px, calc(14px + env(safe-area-inset-bottom)));
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 1000;
    }
    .view-btn {
      background: rgba(13,17,23,0.80);
      border: 1px solid rgba(48,54,61,0.9);
      color: var(--muted);
      font-size: 12px;
      font-family: inherit;
      padding: 7px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .view-btn:hover { color: var(--text); }
    .view-btn.active {
      color: var(--accent);
      border-color: rgba(88,166,255,0.55);
    }
  </style>
</head>
<body>

<div id="cesiumContainer"></div>

<div id="overlay">
  <div id="mission-name">Loading…</div>
  <div class="t-clock">
    <span class="t-sign" id="t-sign">T-</span>
    <span class="t-digits" id="t-digits">--:--:--</span>
  </div>
</div>

<a href="/" id="back-link">← Back</a>

<div id="legend">
  <div class="legend-row">
    <div class="dot" style="background:var(--accent)"></div>
    <span>Booster</span>
  </div>
  <div class="legend-row">
    <div class="dot" style="background:var(--green)"></div>
    <span>Ship</span>
  </div>
  <div id="disclaimer">Nominal flight profile · not live telemetry</div>
</div>

<div id="view-controls">
  <button class="view-btn" id="btn-horizon" onclick="setCameraMode('horizon')">↗ Horizon</button>
  <button class="view-btn" id="btn-orbit"   onclick="setCameraMode('orbit')">↔ Orbit</button>
  <button class="view-btn active" id="btn-globe" onclick="setCameraMode('globe')">⊕ Globe</button>
</div>

<script src="https://cesium.com/downloads/cesiumjs/releases/1.122/Build/Cesium/Cesium.js"></script>
<script>
const viewer = new Cesium.Viewer('cesiumContainer', {
  imageryProvider: false,
  baseLayer: Cesium.ImageryLayer.fromProviderAsync(
    Cesium.TileMapServiceImageryProvider.fromUrl(
      Cesium.buildModuleUrl('Assets/Textures/NaturalEarthII')
    )
  ),
  animation: false,
  baseLayerPicker: false,
  fullscreenButton: false,
  geocoder: false,
  homeButton: false,
  infoBox: false,
  sceneModePicker: false,
  selectionIndicator: false,
  timeline: false,
  navigationHelpButton: false,
  skyBox: false,
});

viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#0d1117');
viewer.scene.globe.enableLighting = true;

// ── Nominal trajectory waypoints [T+sec, lon°, lat°, alt_m] ────────────
// Approximate IFT profile based on SpaceX webcast telemetry

// Densify: insert linearly-interpolated points so no segment exceeds maxDt.
// Called at build-time so runtime arrays are already fully expanded.
function densify(wpts, maxDt) {
  const out = [wpts[0]];
  for (let i = 1; i < wpts.length; i++) {
    const [t0, lon0, lat0, alt0] = wpts[i - 1];
    const [t1, lon1, lat1, alt1] = wpts[i];
    const n = Math.ceil((t1 - t0) / maxDt);
    for (let s = 1; s <= n; s++) {
      const f = s / n;
      out.push([
        t0 + f * (t1 - t0),
        lon0 + f * (lon1 - lon0),
        lat0 + f * (lat1 - lat0),
        Math.round(alt0 + f * (alt1 - alt0)),
      ]);
    }
  }
  return out;
}

// Shared boost phase (T=0 → stage sep at T=170).
// Both vehicles fly this identical path; densified to 5 s for smooth rendering.
//
// Flight 13 (Jul 2026, V3 2nd flight, Pad 2) published trajectory:
//   Heading ESE (~110° azimuth) over Gulf of Mexico.
//   Ship threads between Jamaica & Cuba (~-79°W, 19.7°N) around SECO,
//   then between St. Vincent & Grenada (~-61.5°W, 12.7°N) in the Leeward Islands,
//   then southeast to Indian Ocean off Western Australia (~110°E, 33°S) at T+65 min.
//   Booster does boostback and splashes in Gulf ~120 km south of pad at T+6:53.
//   Source: SpaceX Flight 13 flight plan (corroborated by Wikipedia / NSF), Jul 2026.
const BOOST_CTL = [
  [  0, -97.157, 25.997,     0],  // Liftoff (Starbase, Pad 2)
  [ 10, -97.145, 25.994,  1200],
  [ 20, -97.110, 25.980,  4500],
  [ 30, -97.030, 25.951,  9500],
  [ 45, -96.875, 25.893, 18000],  // Max-Q
  [ 60, -96.655, 25.813, 28000],
  [ 80, -96.310, 25.688, 41000],
  [100, -95.935, 25.550, 52000],
  [120, -95.500, 25.390, 61000],
  [140, -95.035, 25.218, 68000],
  [160, -94.535, 25.033, 73000],  // MECO
  [170, -94.040, 24.850, 75000],  // Stage Sep
];
const BOOST_DENSE = densify(BOOST_CTL, 5);  // ~34 points at ≤5 s intervals

const BOOSTER = [
  ...BOOST_DENSE,
  [190, -93.480, 24.665, 80000],  // Apogee after boostback burn (T+2:25–3:03)
  [220, -93.780, 24.720, 74000],
  [250, -94.200, 24.780, 62000],
  [280, -94.800, 24.820, 50000],
  [310, -95.500, 24.850, 38000],
  [340, -96.100, 24.870, 26000],  // Entry burn
  [370, -96.600, 24.885, 13000],
  [400, -96.900, 24.893,  4000],
  [420, -97.100, 24.900,     0],  // Gulf of Mexico splashdown (~120 km south of pad)
];

const SHIP = [
  ...BOOST_DENSE,  // shared pre-sep phase at 5 s resolution
  [ 200, -92.700, 24.400,  90000],
  [ 250, -90.400, 23.600, 115000],
  [ 300, -88.100, 22.900, 135000],
  [ 350, -85.800, 22.100, 147000],
  [ 420, -82.600, 21.000, 154000],
  [ 485, -79.300, 19.900, 155000],  // SECO T+8:05 — threads between Jamaica (18.5°N) & Cuba (20°N)
  [ 800, -61.500, 12.700, 160000],  // threads between St. Vincent & Grenada
  [1100, -38.500,  7.800, 163000],
  [1400, -17.500,  3.100, 163000],  // Near apogee
  [1700,   3.500, -1.700, 161000],
  [2000,  25.000, -6.400, 158000],
  [2300,  46.000,-11.100, 150000],
  [2600,  67.000,-15.800, 117000],
  [2850,  83.000,-19.500,  75000],  // Reentry interface (T+47:30, per Flight 13 plan)
  [3100,  93.000,-26.000,  25000],
  [3400, 103.000,-30.000,   8000],
  [3700, 108.000,-32.000,   1500],
  [3921, 110.000,-33.000,      0],  // Indian Ocean splashdown off Western Australia (T+1:05:21)
];

function toCzmlPositions(wpts) {
  return wpts.flatMap(([t, lon, lat, alt]) => [t, lon, lat, alt]);
}

function interpolatePos(wpts, tSec) {
  if (tSec <= wpts[0][0]) return [wpts[0][1], wpts[0][2], wpts[0][3]];
  for (let i = 1; i < wpts.length; i++) {
    const [t0, lon0, lat0, alt0] = wpts[i - 1];
    const [t1, lon1, lat1, alt1] = wpts[i];
    if (tSec <= t1) {
      const f = (tSec - t0) / (t1 - t0);
      return [lon0 + f*(lon1-lon0), lat0 + f*(lat1-lat0), alt0 + f*(alt1-alt0)];
    }
  }
  const w = wpts[wpts.length - 1];
  return [w[1], w[2], w[3]];
}

// [label, T+sec, waypoint array, pixel label offset [x,y]]
// T+ times from the official SpaceX Flight 13 flight plan.
const FLIGHT_EVENTS = [
  ['Max-Q',          58,   SHIP,    [  0, -20]],   // T+0:58
  ['MECO',          138,   BOOSTER, [-68, -14]],   // T+2:18
  ['Stage Sep',     141,   SHIP,    [ 68, -14]],   // T+2:21
  ['Boostback Burn',145,   BOOSTER, [  0,  18]],   // T+2:25
  ['Landing Burn',  387,   BOOSTER, [  0, -20]],   // T+6:27
  ['Ship SECO',     485,   SHIP,    [  0, -20]],   // T+8:05
  ['Reentry',      2850,   SHIP,    [  0,  18]],   // T+47:30
  ['Splashdown',   3921,   SHIP,    [  0, -20]],   // T+1:05:21
];

function addEventMarkers() {
  FLIGHT_EVENTS.forEach(([label, tSec, wpts, [ox, oy]]) => {
    const [lon, lat, alt] = interpolatePos(wpts, tSec);
    viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(lon, lat, alt),
      point: {
        color: Cesium.Color.WHITE.withAlpha(0.9),
        pixelSize: 6,
        outlineColor: Cesium.Color.fromCssColorString('#0d1117'),
        outlineWidth: 1.5,
      },
      label: {
        text: label,
        font: '11px system-ui, -apple-system, sans-serif',
        fillColor: Cesium.Color.fromCssColorString('#c9d1d9'),
        outlineColor: Cesium.Color.fromCssColorString('#0d1117'),
        outlineWidth: 2,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
        pixelOffset: new Cesium.Cartesian2(ox, oy),
        distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 8_000_000),
      }
    });
  });
}

function buildCzml(t0Iso, name) {
  const t0 = new Date(t0Iso);
  const endBooster = new Date(t0.getTime() + BOOSTER.at(-1)[0] * 1000).toISOString();
  const endShip    = new Date(t0.getTime() + SHIP.at(-1)[0]    * 1000).toISOString();

  return [
    {
      id: 'document', name, version: '1.0',
      clock: {
        interval: `${t0Iso}/${endShip}`,
        currentTime: new Date().toISOString(),
        multiplier: 1,
        range: 'UNBOUNDED',
        step: 'SYSTEM_CLOCK'
      }
    },
    {
      id: 'launchpad', name: 'Starbase',
      position: { cartographicDegrees: [-97.157, 25.997, 20] },
      point: { color: { rgba: [255,255,255,255] }, pixelSize: 8 },
      label: {
        text: 'Starbase',
        font: '11px system-ui',
        fillColor: { rgba: [201,209,217,255] },
        outlineColor: { rgba: [0,0,0,255] },
        outlineWidth: 2,
        style: 'FILL_AND_OUTLINE',
        pixelOffset: { cartesian2: [0, -18] }
      }
    },
    {
      id: 'booster', name: 'Booster',
      availability: `${t0Iso}/${endBooster}`,
      path: {
        show: true,
        material: { solidColor: { color: { rgba: [88,166,255,255] } } },
        width: 4,
        leadTime: 0,
        trailTime: 7200
      },
      point: {
        color: { rgba: [88,166,255,255] },
        pixelSize: 11,
        outlineColor: { rgba: [255,255,255,160] },
        outlineWidth: 1
      },
      position: {
        epoch: t0Iso,
        cartographicDegrees: toCzmlPositions(BOOSTER),
        interpolationAlgorithm: 'LAGRANGE',
        interpolationDegree: 3
      }
    },
    {
      id: 'ship', name: 'Ship',
      availability: `${t0Iso}/${endShip}`,
      path: {
        show: true,
        material: { solidColor: { color: { rgba: [63,185,80,255] } } },
        width: 4,
        leadTime: 0,
        trailTime: 7200
      },
      point: {
        color: { rgba: [63,185,80,255] },
        pixelSize: 11,
        outlineColor: { rgba: [255,255,255,160] },
        outlineWidth: 1
      },
      position: {
        epoch: t0Iso,
        cartographicDegrees: toCzmlPositions(SHIP),
        interpolationAlgorithm: 'LAGRANGE',
        interpolationDegree: 3
      }
    }
  ];
}

// ── Ghost planned-trajectory polylines ──────────────────────────────────
function addPlannedPaths() {
  const toCartesian = wpts =>
    wpts.map(([, lon, lat, alt]) => Cesium.Cartesian3.fromDegrees(lon, lat, alt));

  viewer.entities.add({
    polyline: {
      positions: toCartesian(BOOSTER),
      width: 1.5,
      material: Cesium.Color.fromBytes(88, 166, 255, 80),
      clampToGround: false,
    }
  });

  viewer.entities.add({
    polyline: {
      positions: toCartesian(SHIP),
      width: 1.5,
      material: Cesium.Color.fromBytes(63, 185, 80, 80),
      clampToGround: false,
    }
  });
}

// ── Camera follow modes ──────────────────────────────────────────────────
const isMobile = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
let cameraMode = 'globe';
let trackHandler = null;
let lastEntityPos = null;

function getActiveVehicle() {
  const tSec = t0Ms ? (Date.now() - t0Ms) / 1000 : -9999;
  return tSec < 420 ? 'booster' : 'ship';
}

function getTrackedPos() {
  const ds = viewer.dataSources.get(0);
  if (!ds) return null;
  const entity = ds.entities.getById(getActiveVehicle());
  if (!entity) return null;
  return entity.position?.getValue(viewer.clock.currentTime)
      ?? Cesium.Cartesian3.fromDegrees(-97.157, 25.997, 20);
}

// Translate the camera by the same delta as the entity each frame.
// This keeps the vehicle in frame without touching heading/pitch,
// so any user rotation or zoom survives between frames.
function followCamera() {
  const currentPos = getTrackedPos();
  if (!currentPos) return;

  if (lastEntityPos) {
    const delta = Cesium.Cartesian3.subtract(currentPos, lastEntityPos, new Cesium.Cartesian3());
    viewer.camera.position = Cesium.Cartesian3.add(
      viewer.camera.position, delta, new Cesium.Cartesian3()
    );
  }
  lastEntityPos = Cesium.Cartesian3.clone(currentPos);
}

function startTracking() {
  lastEntityPos = null; // skip delta on first frame to avoid jump
  trackHandler = followCamera;
  viewer.scene.postRender.addEventListener(trackHandler);
}

function updateViewButtons(mode) {
  document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
  const el = document.getElementById('btn-' + mode);
  if (el) el.classList.add('active');
}

function setCameraMode(mode) {
  cameraMode = mode;
  updateViewButtons(mode);
  viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY); // release any existing lock

  if (trackHandler) {
    viewer.scene.postRender.removeEventListener(trackHandler);
    trackHandler = null;
  }

  if (mode === 'globe') {
    // Fly to overview, then begin delta-tracking so vehicle stays in frame
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(-80, 22, 13_500_000),
      duration: 1.5,
      complete: startTracking,
    });
    return;
  }

  // Horizon / Orbit: set the initial view with lookAt, then immediately
  // release the lock so the user can freely rotate/zoom from that position.
  const target = getTrackedPos() ?? Cesium.Cartesian3.fromDegrees(-97.157, 25.997, 20);
  const offset = mode === 'horizon'
    ? new Cesium.Cartesian3(0, -130_000, 12_000)   // 130 km south, 12 km above
    : new Cesium.Cartesian3(0, -380_000, 80_000);  // 380 km south, 80 km above

  viewer.camera.lookAt(target, offset); // positions camera
  viewer.camera.lookAtTransform(Cesium.Matrix4.IDENTITY); // release lock → free rotation
  startTracking(); // translate camera with entity from here on
}

// ── T± overlay clock ────────────────────────────────────────────────────
let t0Ms = null;

function p2(n) { return String(n).padStart(2, '0'); }

function tickOverlay() {
  if (!t0Ms) return;
  const delta = t0Ms - Date.now();
  const abs = Math.floor(Math.abs(delta) / 1000);
  document.getElementById('t-sign').textContent  = delta >= 0 ? 'T-' : 'T+';
  document.getElementById('t-digits').textContent =
    `${p2(Math.floor(abs / 3600))}:${p2(Math.floor((abs % 3600) / 60))}:${p2(abs % 60)}`;
}
setInterval(tickOverlay, 1000);

// ── Cached launch fetch ──────────────────────────────────────────────────
const LAUNCH_CACHE_KEY = 'starshipit_launch_v1';
const LAUNCH_CACHE_TTL = 15 * 60 * 1000; // 15 minutes

async function fetchLaunch() {
  try {
    const raw = localStorage.getItem(LAUNCH_CACHE_KEY);
    if (raw) {
      const { ts, data } = JSON.parse(raw);
      if (Date.now() - ts < LAUNCH_CACHE_TTL) return data;
    }
  } catch {}

  try {
    const res = await fetch(
      'https://ll.thespacedevs.com/2.2.0/launch/upcoming/?search=Starship&limit=1'
    );
    if (!res.ok) throw new Error(`API ${res.status}`);
    const data = await res.json();
    try { localStorage.setItem(LAUNCH_CACHE_KEY, JSON.stringify({ ts: Date.now(), data })); } catch {}
    return data;
  } catch (err) {
    try {
      const raw = localStorage.getItem(LAUNCH_CACHE_KEY);
      if (raw) return JSON.parse(raw).data;
    } catch {}
    throw err;
  }
}

// ── Init ────────────────────────────────────────────────────────────────
async function init() {
  try {
    const data = await fetchLaunch();
    const launch = data.results[0];

    t0Ms = new Date(launch.net).getTime();
    document.getElementById('mission-name').textContent = launch.name;
    document.title = `StarshipIt — ${launch.name}`;

    addPlannedPaths();
    addEventMarkers();

    const czml = buildCzml(launch.net, launch.name);
    const ds   = await Cesium.CzmlDataSource.load(czml);
    viewer.dataSources.add(ds);

    // Sync Cesium clock to wall time
    viewer.clock.currentTime  = Cesium.JulianDate.fromDate(new Date());
    viewer.clock.shouldAnimate = true;
    viewer.clock.multiplier   = 1;

    setCameraMode('globe');

    tickOverlay();
  } catch {
    document.getElementById('mission-name').textContent = 'Unable to load launch data';
  }
}

init();
</script>
</body>
</html>
